<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 378" width="400" height="378" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1c2230">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#3157d5"/>
    </marker>
  </defs>
  <rect width="400" height="378" fill="#fff"/>

  <!-- start -->
  <rect x="50" y="8" width="200" height="40" rx="20" fill="#3157d5"/>
  <text x="150" y="33" text-anchor="middle" fill="#fff" font-weight="bold">random tour</text>
  <line x1="150" y1="48" x2="150" y2="76" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- candidate lists, once -->
  <rect x="50" y="78" width="200" height="40" rx="6" fill="#eef2fc" stroke="#3157d5" stroke-width="2"/>
  <text x="150" y="103" text-anchor="middle" font-weight="bold">10 nearest of every node</text>
  <line x1="150" y1="118" x2="150" y2="146" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- core calculations -->
  <rect x="50" y="148" width="200" height="40" rx="6" fill="#fff4dc" stroke="#e0a526" stroke-width="2"/>
  <text x="150" y="173" text-anchor="middle" font-weight="bold">Δ of candidate moves</text>
  <line x1="150" y1="188" x2="150" y2="216" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop condition -->
  <path d="M150,218L245,254L150,290L55,254z" fill="#eef2fc" stroke="#3157d5" stroke-width="2"/>
  <text x="150" y="259" text-anchor="middle" font-weight="bold">min Δ &lt; 0 ?</text>
  <line x1="245" y1="254" x2="288" y2="254" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266" y="247" text-anchor="middle" font-size="11" fill="#4a5163">no</text>
  <rect x="290" y="234" width="100" height="40" rx="20" fill="#3157d5"/>
  <text x="340" y="259" text-anchor="middle" fill="#fff" font-weight="bold">return tour</text>
  <line x1="150" y1="290" x2="150" y2="324" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="159" y="311" font-size="11" fill="#4a5163">yes</text>

  <!-- apply, then evaluate again -->
  <rect x="50" y="326" width="200" height="40" rx="6" fill="#eef2fc" stroke="#3157d5" stroke-width="2"/>
  <text x="150" y="351" text-anchor="middle" font-weight="bold">apply it</text>
  <path d="M50,346H20V168H48" fill="none" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
