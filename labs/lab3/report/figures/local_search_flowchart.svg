<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 308" width="400" height="308" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1c2230">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#3157d5"/>
    </marker>
  </defs>
  <rect width="400" height="308" fill="#fff"/>

  <!-- start -->
  <rect x="50" y="8" width="200" height="40" rx="20" fill="#3157d5"/>
  <text x="150" y="33" text-anchor="middle" fill="#fff" font-weight="bold">starting tour</text>
  <line x1="150" y1="48" x2="150" y2="76" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- core calculations -->
  <rect x="50" y="78" width="200" height="40" rx="6" fill="#fff4dc" stroke="#e0a526" stroke-width="2"/>
  <text x="150" y="103" text-anchor="middle" font-weight="bold">pick a move by Δ</text>
  <line x1="150" y1="118" x2="150" y2="146" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop condition -->
  <path d="M150,148L245,184L150,220L55,184z" fill="#eef2fc" stroke="#3157d5" stroke-width="2"/>
  <text x="150" y="189" text-anchor="middle" font-weight="bold">Δ &lt; 0 ?</text>
  <line x1="245" y1="184" x2="288" y2="184" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266" y="177" text-anchor="middle" font-size="11" fill="#4a5163">no</text>
  <rect x="290" y="164" width="100" height="40" rx="20" fill="#3157d5"/>
  <text x="340" y="189" text-anchor="middle" fill="#fff" font-weight="bold">return tour</text>
  <line x1="150" y1="220" x2="150" y2="254" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="159" y="241" font-size="11" fill="#4a5163">yes</text>

  <!-- apply, then search again -->
  <rect x="50" y="256" width="200" height="40" rx="6" fill="#eef2fc" stroke="#3157d5" stroke-width="2"/>
  <text x="150" y="281" text-anchor="middle" font-weight="bold">apply it</text>
  <path d="M50,276H20V98H48" fill="none" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
