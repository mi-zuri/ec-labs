<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 308" width="400" height="308" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1c2230">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#3157d5"/>
    </marker>
  </defs>
  <rect width="400" height="308" fill="#fff"/>

  <!-- start -->
  <rect x="50" y="8" width="200" height="40" rx="20" fill="#3157d5"/>
  <text x="150" y="33" text-anchor="middle" fill="#fff" font-weight="bold">start tour</text>
  <line x1="150" y1="48" x2="150" y2="76" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop condition -->
  <path d="M150,78L245,114L150,150L55,114z" fill="#eef2fc" stroke="#3157d5" stroke-width="2"/>
  <text x="150" y="119" text-anchor="middle" font-weight="bold">|tour| &lt; k ?</text>
  <line x1="245" y1="114" x2="288" y2="114" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266" y="107" text-anchor="middle" font-size="11" fill="#4a5163">no</text>
  <rect x="290" y="94" width="100" height="40" rx="20" fill="#3157d5"/>
  <text x="340" y="119" text-anchor="middle" fill="#fff" font-weight="bold">return tour</text>
  <line x1="150" y1="150" x2="150" y2="184" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="159" y="171" font-size="11" fill="#4a5163">yes</text>

  <!-- core calculations -->
  <rect x="50" y="186" width="200" height="40" rx="6" fill="#fff4dc" stroke="#e0a526" stroke-width="2"/>
  <text x="150" y="211" text-anchor="middle" font-weight="bold">Δ of every node and place</text>
  <line x1="150" y1="226" x2="150" y2="254" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- insertion, then back to the loop condition -->
  <rect x="50" y="256" width="200" height="40" rx="6" fill="#eef2fc" stroke="#3157d5" stroke-width="2"/>
  <text x="150" y="281" text-anchor="middle" font-weight="bold">insert the smallest Δ</text>
  <path d="M50,276H20V114H53" fill="none" stroke="#3157d5" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
